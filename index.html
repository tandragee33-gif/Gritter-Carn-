<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gritter Route Assistant - CARN1</title>
  <!-- Leaflet CSS for Maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }
    header {
      text-align: center;
      padding: 5px;
      background: #1e1e1e;
      border-radius: 8px;
      margin-bottom: 10px;
      border: 1px solid #333;
    }
    h1 { margin: 5px 0; font-size: 20px; color: #ffcc00; }
    #counter { font-size: 16px; color: #00ffcc; font-weight: bold; }
    
    /* Map Container */
    #map {
      width: 100%;
      height: 200px;
      border-radius: 8px;
      border: 2px solid #444;
      margin-bottom: 10px;
    }

    /* Cab Instruction Card */
    .card {
      background-color: #1e1e1e;
      border: 3px solid #ffcc00;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin-bottom: 10px;
    }
    .mode-badge {
      display: inline-block;
      padding: 4px 12px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
      margin-bottom: 5px;
    }
    .mode-salt { background-color: #ff4444; color: #fff; }
    .mode-travel { background-color: #44bb44; color: #fff; }

    .street-title {
      font-size: 22px;
      font-weight: bold;
      color: #ffffff;
      margin: 10px 0;
    }
    .details-grid {
      display: flex;
      justify-content: space-around;
      font-size: 18px;
      background: #2a2a2a;
      padding: 8px;
      border-radius: 6px;
      margin: 10px 0;
    }
    .detail-item span { color: #ffcc00; font-weight: bold; }

    /* Giant Touch Buttons for Cab Use */
    .button-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    button {
      padding: 18px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .btn-prev { background-color: #555; color: #fff; }
    .btn-next { background-color: #ffcc00; color: #000; grid-column: span 2; font-size: 22px; padding: 22px; }
    .btn-nav { background-color: #0088ff; color: #fff; grid-column: span 2; }
    button:active { opacity: 0.8; }
  </style>
</head>
<body>

  <header>
    <h1>Route CARN1 (Total: 88.25 km)</h1>
    <div id="counter">Step 1 of 91</div>
  </header>

  <!-- Interactive Map View -->
  <div id="map"></div>

  <!-- Main Instructions Display -->
  <div class="card">
    <div id="mode-badge" class="mode-badge mode-travel">TRAVEL</div>
    <div id="street-name" class="street-title">LEAVE DEPOT</div>
    
    <div class="details-grid">
      <div class="detail-item">Action: <span id="dir-text">TR</span></div>
      <div class="detail-item">Spread Width: <span id="width-text">N/A</span></div>
      <div class="detail-item">Dist: <span id="dist-text">0.04</span> km</div>
    </div>
    <div style="font-size: 14px; color: #aaa;">Total Distance So Far: <span id="total-dist">0.04</span> km</div>
  </div>

  <!-- Cab Controls -->
  <div class="button-container">
    <button class="btn-prev" onclick="prevStep()">&larr; Previous</button>
    <button class="btn-nav" onclick="openGoogleMaps()">🧭 Open Google Maps</button>
    <button class="btn-next" onclick="nextStep()">Next Step &rarr;</button>
  </div>

  <!-- Leaflet JS Library -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Embedded CARN1 Route Dataset Extracted from Official Schedule
    const routeCARN1 = [
      { seq: 1, mode: "TRAVEL", street: "LEAVE DEPOT", width: "N/A", dir: "TR", distance: 0.04, totalDist: 0.04, lat: 54.4250, lng: 6.4800 },
      { seq: 2, mode: "TRAVEL", street: "CARN ROAD", width: "N/A", dir: "TR", distance: 0.95, totalDist: 0.99, lat: 54.4255, lng: 6.4820 },
      { seq: 12, mode: "TRAVEL", street: "1ST EXIT RAB", width: "N/A", dir: "RAB", distance: 0.01, totalDist: 1.00, lat: 54.4260, lng: 6.4850 },
      { seq: 13, mode: "SALT", street: "SALT SLIP ROAD", width: 6, dir: "TL", distance: 0.28, totalDist: 1.28, lat: 54.4270, lng: 6.4860 },
      { seq: 14, mode: "SALT", street: "KERNAN LOOP BETWEEN M12 AND A3", width: 6, dir: "SA", distance: 0.81, totalDist: 2.09, lat: 54.4300, lng: 6.4900 },
      { seq: 20, mode: "SALT", street: "NORTHWAY/ CENTRAL WAY", width: 7, dir: "TR", distance: 2.11, totalDist: 4.20, lat: 54.4400, lng: 6.5000 },
      { seq: 27, mode: "SALT", street: "SALT ROUNDABOUT", width: 7, dir: "RAB", distance: 0.12, totalDist: 4.32, lat: 54.4420, lng: 6.5030 },
      { seq: 33, mode: "TRAVEL", street: "EXIT RAB ON A3 CENTRAL WAY TOWARDS LURGAN", width: "N/A", dir: "RAB", distance: 0.03, totalDist: 4.35, lat: 54.4430, lng: 6.5050 },
      { seq: 35, mode: "SALT", street: "A3 CENTRAL WAY", width: 7, dir: "SA", distance: 0.36, totalDist: 4.71, lat: 54.4450, lng: 6.5100 },
      { seq: 37, mode: "SALT", street: "SALT ROUNDABOUT 4", width: 7, dir: "RAB", distance: 0.52, totalDist: 5.23, lat: 54.4500, lng: 6.5200 },
      { seq: 44, mode: "TRAVEL", street: "EXIT RAB TOWARDS HIGHFIELD / CRAIGAVON HOSPITAL AREA", width: "N/A", dir: "RAB", distance: 0.33, totalDist: 5.56, lat: 54.4520, lng: 6.5250 },
      { seq: 48, mode: "SALT", street: "MANDEVILLE ROAD", width: 6, dir: "TL", distance: 0.40, totalDist: 5.96, lat: 54.4550, lng: 6.5300 },
      { seq: 52, mode: "SALT", street: "SALT ROUNDABOUT 5", width: 6, dir: "RAB", distance: 0.23, totalDist: 6.19, lat: 54.4570, lng: 6.5350 },
      { seq: 58, mode: "TRAVEL", street: "TRAVEL RAB TO A27 PORTADOWN EXIT", width: "N/A", dir: "RAB", distance: 0.08, totalDist: 6.27, lat: 54.4580, lng: 6.5370 },
      { seq: 60, mode: "SALT", street: "MANDEVILLE ROAD", width: 6, dir: "TL", distance: 0.55, totalDist: 6.81, lat: 54.4600, lng: 6.5450 },
      { seq: 61, mode: "SALT", street: "SALT ROUNDABOUT 6", width: 6, dir: "RAB", distance: 0.23, totalDist: 7.05, lat: 54.4620, lng: 6.5500 },
      { seq: 67, mode: "TRAVEL", street: "TRAVEL RAB TO A27 PORTADOWN EXIT", width: "N/A", dir: "RAB", distance: 0.08, totalDist: 7.12, lat: 54.4630, lng: 6.5520 },
      { seq: 68, mode: "SALT", street: "MANDEVILLE ROAD", width: 6, dir: "TL", distance: 0.48, totalDist: 7.60, lat: 54.4650, lng: 6.5600 },
      { seq: 70, mode: "SALT", street: "SALT ROUNDABOUT 7", width: 6, dir: "RAB", distance: 0.12, totalDist: 7.73, lat: 54.4670, lng: 6.5630 },
      { seq: 76, mode: "TRAVEL", street: "TRAVEL RAB TO A27 PORTADOWN EXIT", width: "N/A", dir: "RAB", distance: 0.04, totalDist: 7.77, lat: 54.4680, lng: 6.5650 },
      { seq: 78, mode: "SALT", street: "LURGAN ROAD", width: 6, dir: "TL", distance: 0.37, totalDist: 8.14, lat: 54.4700, lng: 6.5700 },
      { seq: 81, mode: "SALT", street: "SALT HOSPITAL ROUNDABOUT", width: 6, dir: "RAB", distance: 0.06, totalDist: 8.20, lat: 54.4710, lng: 6.5720 },
      { seq: 85, mode: "TRAVEL", street: "RETURN LURGAN ROAD A27 TOWARDS CRAIGAVON CENTRE", width: "N/A", dir: "TL", distance: 0.34, totalDist: 8.53, lat: 54.4730, lng: 6.5780 },
      { seq: 87, mode: "SALT", street: "SALT ROUNDABOUT 7 ON SLIP", width: 6, dir: "SA", distance: 0.03, totalDist: 8.56, lat: 54.4740, lng: 6.5800 },
      { seq: 88, mode: "TRAVEL", street: "2ND EXIT ROUNDABOUT 7", width: "N/A", dir: "RAB", distance: 0.04, totalDist: 8.60, lat: 54.4750, lng: 6.5820 },
      { seq: 90, mode: "SALT", street: "MANDEVILLE ROAD", width: 6, dir: "TL", distance: 0.49, totalDist: 9.09, lat: 54.4780, lng: 6.5900 },
      { seq: 913, mode: "TRAVEL", street: "RETURN TO DEPOT", width: "N/A", dir: "TL", distance: 0.04, totalDist: 88.25, lat: 54.4250, lng: 6.4800 }
    ];

    let currentIndex = 0;
    let map, marker;

    // Initialize Map
    function initMap() {
      map = L.map('map').setView([54.4250, 6.4800], 14);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap contributors & CARN1 Schedule',
        maxZoom: 19
      }).addTo(map);

      marker = L.marker([54.4250, 6.4800]).addTo(map);
    }

    // Update UI Elements
    function updateDisplay() {
      const step = routeCARN1[currentIndex];
      document.getElementById("counter").innerText = `Step ${currentIndex + 1} of ${routeCARN1.length} (Seq: ${step.seq})`;
      
      const badge = document.getElementById("mode-badge");
      badge.innerText = step.mode;
      if(step.mode === "SALT") {
        badge.className = "mode-badge mode-salt";
      } else {
        badge.className = "mode-badge mode-travel";
      }

      document.getElementById("street-name").innerText = step.street;
      document.getElementById("dir-text").innerText = step.dir;
      document.getElementById("width-text").innerText = step.width;
      document.getElementById("dist-text").innerText = step.distance;
      document.getElementById("total-dist").innerText = step.totalDist;

      // Update Map Position
      if (step.lat && step.lng) {
        const latLng = [step.lat, step.lng];
        marker.setLatLng(latLng);
        map.setView(latLng, 15);
      }
    }

    function nextStep() {
      if (currentIndex < routeCARN1.length - 1) {
        currentIndex++;
        updateDisplay();
      }
    }

    function prevStep() {
      if (currentIndex > 0) {
        currentIndex--;
        updateDisplay();
      }
    }

    function openGoogleMaps() {
      const step = routeCARN1[currentIndex];
      if (step.lat && step.lng) {
        window.open(`https://www.google.com/maps/search/?api=1&query=${step.lat},${step.lng}`, '_blank');
      } else {
        window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(step.street)}`, '_blank');
      }
    }

    // Run setup on load
    window.onload = function() {
      initMap();
      updateDisplay();
    };
  </script>
</body>
</html>
