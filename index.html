  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #1e1e1e;
      padding: 8px 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #333;
      margin-bottom: 8px;
    }
    h1 { margin: 0; font-size: 16px; color: #ffcc00; }
    
    .status-badge {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 20px;
      text-transform: uppercase;
    }
    .status-online { background: #00aa00; color: #fff; }
    .status-offline { background: #aa0000; color: #fff; }

    /* Map Box */
    #map {
      width: 100%;
      height: 35vh;
      border-radius: 10px;
      border: 2px solid #ffcc00;
      background: #222;
      margin-bottom: 8px;
    }

    /* Cab Main Alert Display Card */
    .card {
      background-color: #1e1e1e;
      border: 3px solid #ffcc00;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .mode-banner {
      padding: 10px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .mode-salt { background-color: #d32f2f; color: #ffffff; animation: flash 1.5s infinite; }
    .mode-travel { background-color: #2e7d32; color: #ffffff; }

    @keyframes flash {
      0% { opacity: 1; }
      50% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    .street-title {
      font-size: 20px;
      font-weight: bold;
      color: #ffffff;
      margin: 6px 0;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      background: #2a2a2a;
      padding: 8px;
      border-radius: 6px;
    }
    .info-box {
      font-size: 13px;
      color: #ccc;
    }
    .info-box div {
      font-size: 16px;
      font-weight: bold;
      color: #ffcc00;
      margin-top: 2px;
    }

    /* Control Bar */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }
    .btn-row {
      display: flex;
      gap: 6px;
    }
    .btn {
      flex: 1;
      padding: 14px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .btn-start { background: #0088ff; color: #fff; }
    .btn-voice { background: #555; color: #fff; }
    .btn-sim { background: #8800cc; color: #fff; }
    .btn-next { background: #ffaa00; color: #000; font-size: 16px; font-weight: 900; padding: 16px; }
  </style>
</head>

    let currentIndex = 0;
    let map, lorryMarker;
    let voiceEnabled = true;
    let simulationInterval = null;
    let preferredVoice = null;
    let gpxCoordinates = [];

    function initVoices() {
      if ('speechSynthesis' in window) {
        let voices = window.speechSynthesis.getVoices();
        preferredVoice = voices.find(v => v.lang.includes('en-GB')) || 
                         voices.find(v => v.lang.includes('en-US')) || 
                         voices[0];
      }
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = initVoices;
      initVoices();
    }

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([54.453905, -6.410553], 15);
      
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      new L.GPX('carn1.gpx', {
        async: true,
        polyline_options: {
          color: '#ffcc00',
          weight: 6,
          opacity: 0.8
        },
        marker_options: {
          startIcon: null,
          endIcon: null,
          wptIcons: {}
        }
      }).on('loaded', function(e) {
        map.fitBounds(e.target.getBounds());

        e.target.eachLayer(function(layer) {
          if (layer instanceof L.Polyline) {
            gpxCoordinates = layer.getLatLngs();
          }
        });

        // Update status once GPX track is ready
        document.getElementById("gps-status").innerText = "READY";
        document.getElementById("gps-status").className = "status-badge status-online";
        updateCabDisplay(false);
      }).addTo(map);

      lorryMarker = L.marker([54.453905, -6.410553]).addTo(map);
      setTimeout(() => { map.invalidateSize(); }, 300);
    }

    function updateCabDisplay(speak = true) {
      if (gpxCoordinates.length === 0) return; // Wait until GPX file is fully loaded

      const step = routeCARN1[currentIndex];
      
      const banner = document.getElementById("mode-banner");
      if (step.mode === "SALT") {
        banner.innerText = `⚠️ SPREAD SALT (${step.width}m)`;
        banner.className = "mode-banner mode-salt";
      } else {
        banner.innerText = "🟢 TRAVEL - NO SPREAD";
        banner.className = "mode-banner mode-travel";
      }

      document.getElementById("street-name").innerText = step.street;
      document.getElementById("dir-text").innerText = step.dir;
      document.getElementById("width-text").innerText = step.width;
      document.getElementById("dist-text").innerText = `${step.totalDist} km`;

      // Position marker strictly along the uploaded GPX track points
      let pointIdx = Math.floor((currentIndex / (routeCARN1.length - 1)) * (gpxCoordinates.length - 1));
      let pos = gpxCoordinates[pointIdx];

      lorryMarker.setLatLng(pos);
      map.panTo(pos);

      if (voiceEnabled && speak) {
        speakInstruction(step);
      }
    }

    function manualNextStep() {
      if (gpxCoordinates.length === 0) {
        alert("Please wait for the map track file to finish loading.");
        return;
      }
      if (currentIndex < routeCARN1.length - 1) {
        currentIndex++;
        updateCabDisplay(true);
      } else {
        alert("Route completed!");
      }
    }

    function getSpokenDirection(dirCode) {
      if (!dirCode) return "";
      let code = dirCode.toUpperCase().trim();
      
      if (code === "TL") return "Turn left";
      if (code === "TR") return "Turn right";
      if (code === "RAB") return "At the roundabout";
      if (code === "RAB TL") return "At the roundabout, turn left";
      if (code === "SA") return "Go straight ahead";
      if (code === "TURN") return "Turn around where safe to do so";
      
      return code;
    }

    function speakInstruction(step) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        
        const actionText = getSpokenDirection(step.dir);
        let text = "";

        if (step.mode === "SALT") {
          text = `${actionText}. Start spreading ${step.width} meters wide on ${step.street}.`;
        } else {
          text = `${actionText}. Travel on ${step.street}. Stop spreading.`;
        }

        const msg = new SpeechSynthesisUtterance(text);
        if (preferredVoice) {
          msg.voice = preferredVoice;
        }
        msg.rate = 0.90;
        msg.pitch = 1.0;
        window.speechSynthesis.speak(msg);
      }
    }

    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      const btn = document.getElementById("voice-btn");
      btn.innerText = voiceEnabled ? "🔊 Voice" : "🔇 Voice";
    }

    function startSimulation() {
      if (gpxCoordinates.length === 0) {
        alert("Please wait a moment for the map track file to load from GitHub.");
        return;
      }

      if (simulationInterval) clearInterval(simulationInterval);
      currentIndex = 0;
      updateCabDisplay(true);
      
      simulationInterval = setInterval(() => {
        if (currentIndex < routeCARN1.length - 1) {
          currentIndex++;
          updateCabDisplay(true);
        } else {
          clearInterval(simulationInterval);
          alert("Simulation finished!");
        }
      }, 5500);
    }

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function startNavigation() {
      if (gpxCoordinates.length === 0) {
        alert("Please wait for the map track file to finish loading.");
        return;
      }

      if (simulationInterval) clearInterval(simulationInterval);
      const status = document.getElementById("gps-status");

      if (navigator.geolocation) {
        status.innerText = "GPS ACTIVE";
        status.className = "status-badge status-online";

        navigator.geolocation.watchPosition(pos => {
          const uLat = pos.coords.latitude;
          const uLng = pos.coords.longitude;

          lorryMarker.setLatLng([uLat, uLng]);
          map.panTo([uLat, uLng]);

          const targetStep = routeCARN1[currentIndex];
          let pointIdx = Math.floor((currentIndex / (routeCARN1.length - 1)) * (gpxCoordinates.length - 1));
          let targetLatLng = gpxCoordinates[pointIdx];

          const dist = getDistanceMeters(uLat, uLng, targetLatLng.lat, targetLatLng.lng);
          status.innerText = `GPS (${Math.round(dist)}m)`;

          if (dist < 100 && currentIndex < routeCARN1.length - 1) {
            currentIndex++;
            updateCabDisplay(true);
          }
        }, err => {
          status.innerText = "GPS BLOCKED";
          status.className = "status-badge status-offline";
          alert("GPS Permission Error: Please allow Location access in your mobile browser settings.");
        }, {
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 10000
        });
      } else {
        alert("Geolocation is not supported by your mobile browser.");
      }
    }

    window.onload = function() {
      initMap();
    };
