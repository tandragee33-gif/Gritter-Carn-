      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    /* Top Header Bar */
    header {
      background-color: #1e1e1e;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #333;
      z-index: 1000;
    }
    .route-title {
      font-size: 18px;
      font-weight: bold;
      color: #ffcc00;
    }
    .header-controls {
      display: flex;
      gap: 10px;
    }
    .btn-small {
      background-color: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-small.active {
      background-color: #00e676;
      color: #000;
      border-color: #00e676;
    }

    /* Map Area */
    #map {
      flex: 1;
      width: 100%;
      background-color: #242424;
      z-index: 1;
    }

    /* Cab Display & Controls Panel */
    .cab-panel {
      background-color: #181818;
      border-top: 3px solid #ffcc00;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 1000;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
    }

    /* Status Indicator Box */
    .status-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .status-salt {
      background-color: #2e7d32;
      color: #ffffff;
      border: 2px solid #4caf50;
    }
    .status-travel {
      background-color: #c62828;
      color: #ffffff;
      border: 2px solid #ef5350;
    }

    /* Instruction Info Box */
    .instruction-card {
      background-color: #242424;
      border-radius: 8px;
      padding: 12px 15px;
      border: 1px solid #333;
    }
    .street-name {
      font-size: 24px;
      font-weight: 800;
      color: #ffcc00;
      margin-bottom: 5px;
    }
    .details-row {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      color: #cccccc;
    }
    .highlight-val {
      color: #00e676;
      font-weight: bold;
    }

    /* Primary Navigation Buttons */
    .nav-buttons {
      display: flex;
      gap: 10px;
    }
    .btn-nav {
      flex: 1;
      padding: 18px 0;
      font-size: 22px;
      font-weight: 900;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn-prev {
      background-color: #424242;
      color: #ffffff;
      flex: 0.35;
    }
    .btn-next {
      background-color: #ffcc00;
      color: #000000;
      flex: 0.65;
    }
    .btn-prev:active { background-color: #616161; }
    .btn-next:active { background-color: #e6b800; }
  </style>
