<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gritter Automatic Hands-Free Navigator - CARN1</title>
  <!-- Leaflet CSS for Map Rendering -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #1e1e1e;
      padding: 8px 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #333;
      margin-bottom: 8px;
    }
    h1 { margin: 0; font-size: 16px; color: #ffcc00; }
    
    .status-badge {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 20px;
      text-transform: uppercase;
    }
    .status-online { background: #00aa00; color: #fff; }
    .status-offline { background: #aa0000; color: #fff; }

    /* Hands-Free High Visibility Map */
    #map {
      width: 100%;
      height: 50vh;
      border-radius: 10px;
      border: 2px solid #ffcc00;
      background: #222;
      margin-bottom: 8px;
    }

    /* Cab Main Alert Display Card */
    .card {
      background-color: #1e1e1e;
      border: 3px solid #ffcc00;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .mode-banner {
      padding: 10px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .mode-salt { background-color: #d32f2f; color: #ffffff; animation: flash 1.5s infinite; }
    .mode-travel { background-color: #2e7d32; color: #ffffff; }

    @keyframes flash {
      0% { opacity: 1; }
      50% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    .street-title {
      font-size: 22px;
      font-weight: bold;
      color: #ffffff;
      margin: 8px 0;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      background: #2a2a2a;
      padding: 8px;
      border-radius: 6px;
    }
    .info-box {
      font-size: 14px;
      color: #ccc;
    }
    .info-box div {
      font-size: 18px;
      font-weight: bold;
      color: #ffcc00;
      margin-top: 2px;
    }

    /* Control Bar */
    .controls {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .btn {
      flex: 1;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .btn-start { background: #0088ff; color: #fff; }
    .btn-voice { background: #555; color: #fff; }
  </style>
</head>
<body>

  <header>
    <h1>Route CARN1 (88.25 km)</h1>
    <div id="gps-status" class="status-badge status-offline">GPS OFF</div>
  </header>

  <!-- Live Map View -->
  <div id="map"></div>

  <!-- High-Contrast Hands-Free Cab Card -->
  <div class="card">
    <div id="mode-banner" class="mode-banner mode-travel">INITIALIZING...</div>
    <div id="street-name" class="street-title">STARTING DEPOT</div>

    <div class="info-grid">
      <div class="info-box">Action<div id="dir-text">--</div></div>
      <div class="info-box">Spread Width<div id="width-text">--</div></div>
      <div class="info-box">Dist to Next<div id="dist-text">--</div></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-voice" id="voice-btn" onclick="toggleVoice()">🔊 Voice: ON</button>
    <button class="btn btn-start" id="start-btn" onclick="startNavigation()">▶ Start Driving Mode</button>
  </div>

  <!-- Leaflet JavaScript -->

      { seq: 27, mode: "SALT", street: "SALT ROUNDABOUT", width: "7m", dir: "RAB", distance: 0.12, totalDist: 4.32, lat: 54.4420, lng: -6.5030 },

      { seq: 35, mode: "SALT", street: "A3 CENTRAL WAY", width: "7m", dir: "SA", distance: 0.36, totalDist: 4.71, lat: 54.4450, lng: -6.5100 },
      { seq: 37, mode: "SALT", street: "SALT ROUNDABOUT 4", width: "7m", dir: "RAB", distance: 0.52, totalDist: 5.23, lat: 54.4500, lng: -6.5200 },

      { seq: 68, mode: "SALT", street: "MANDEVILLE ROAD", width: "6m", dir: "TL", distance: 0.48, totalDist: 7.60, lat: 54.4650, lng: -6.5600 },
      { seq: 70, mode: "SALT", street: "SALT ROUNDABOUT 7", width: "6m", dir: "RAB", distance: 0.12, totalDist: 7.73, lat: 54.4670, lng: -6.5630 },
      { seq: 76, mode: "TRAVEL", street: "TRAVEL RAB TO A27 PORTADOWN EXIT", width: "N/A", dir: "RAB", distance: 0.04, totalDist: 7.77, lat: 54.4680, lng: -6.5650 },
      { seq: 78, mode: "SALT", street: "LURGAN ROAD", width: "6m", dir: "TL", distance: 0.37, totalDist: 8.14, lat: 54.4700, lng: -6.5700 },
      { seq: 81, mode: "SALT", street: "SALT HOSPITAL ROUNDABOUT", width: "6m", dir: "RAB", distance: 0.06, totalDist: 8.20, lat: 54.4710, lng: -6.5720 },
      { seq: 85, mode: "TRAVEL", street: "RETURN LURGAN ROAD A27 TOWARDS CRAIGAVON CENTRE", width: "N/A", dir: "TL", distance: 0.34, totalDist: 8.53, lat: 54.4730, lng: -6.5780 },
      { seq: 87, mode: "SALT", street: "SALT ROUNDABOUT 7 ON SLIP", width: "6m", dir: "SA", distance: 0.03, totalDist: 8.56, lat: 54.4740, lng: -6.5800 },
      { seq: 88, mode: "TRAVEL", street: "2ND EXIT ROUNDABOUT 7", width: "N/A", dir: "RAB", distance: 0.04, totalDist: 8.60, lat: 54.4750, lng: -6.5820 },
      { seq: 90, mode: "SALT", street: "MANDEVILLE ROAD", width: "6m", dir: "TL", distance: 0.49, totalDist: 9.09, lat: 54.4780, lng: -6.5900 },
      { seq: 117, mode: "SALT", street: "HIGHFIELD NORTH ROAD", width: "6m", dir: "TL", distance: 0.41, totalDist: 11.88, lat: 54.4530, lng: -6.5180 },

      { seq: 181, mode: "SALT", street: "SALT J1 ROUNDABOUT", width: "6m", dir: "RAB", distance: 0.17, totalDist: 19.50, lat: 54.4420, lng: -6.4680 },

      { seq: 208, mode: "SALT", street: "NORTHWAY ON SLIP / NORTHWAY TO MILL AVENUE", width: "7m", dir: "TL", distance: 2.74, totalDist: 25.22, lat: 54.4320, lng: -6.4950 },
      { seq: 283, mode: "SALT", street: "A4 CORCRAIN ROAD / CHARLES STREET", width: "6m", dir: "TR", distance: 1.43, totalDist: 30.08, lat: 54.4250, lng: -6.4600 },
      { seq: 305, mode: "SALT", street: "GARVAGHY ROAD", width: "7m", dir: "TL", distance: 0.30, totalDist: 30.42, lat: 54.4280, lng: -6.4620 },
      { seq: 320, mode: "SALT", street: "OBINS STREET / PARK ROAD", width: "6m", dir: "TL", distance: 1.43, totalDist: 32.29, lat: 54.4350, lng: -6.4650 },
      { seq: 406, mode: "SALT", street: "MEADOW LANE", width: "7m", dir: "TL", distance: 0.35, totalDist: 37.34, lat: 54.4210, lng: -6.4420 },
      { seq: 445, mode: "SALT", street: "A27 CHURCH STREET / ARMAGH ROAD", width: "6m", dir: "SA", distance: 1.73, totalDist: 41.60, lat: 54.4150, lng: -6.4500 },
      { seq: 574, mode: "SALT", street: "A3 NORTHWAY", width: "7m", dir: "SA", distance: 2.71, totalDist: 51.26, lat: 54.4450, lng: -6.5050 },
      { seq: 605, mode: "SALT", street: "SEAGOE ROAD", width: "6m", dir: "SA", distance: 0.41, totalDist: 54.00, lat: 54.4380, lng: -6.4750 },
      { seq: 669, mode: "SALT", street: "BALLYHANNON ROAD", width: "5m", dir: "TR", distance: 1.33, totalDist: 60.12, lat: 54.4600, lng: -6.5300 },
      { seq: 689, mode: "SALT", street: "OLD LURGAN ROAD", width: "6m", dir: "TL", distance: 1.00, totalDist: 62.55, lat: 54.4650, lng: -6.5400 },
      { seq: 715, mode: "SALT", street: "KNOCKMENAGH ROAD", width: "6m", dir: "TL", distance: 1.02, totalDist: 66.14, lat: 54.4550, lng: -6.5500 },
      { seq: 748, mode: "SALT", street: "SUGAR ISLAND ROAD", width: "5m", dir: "TR", distance: 1.84, totalDist: 71.19, lat: 54.4750, lng: -6.5650 },
      { seq: 767, mode: "SALT", street: "DEANS ROAD", width: "4m", dir: "SA", distance: 1.42, totalDist: 74.25, lat: 54.4800, lng: -6.5700 },
      { seq: 809, mode: "SALT", street: "EXIT MINI RAB ONTO PRINCESS WAY", width: "6m", dir: "TL", distance: 1.15, totalDist: 80.87, lat: 54.4250, lng: -6.4550 },
      { seq: 874, mode: "SALT", street: "JOSEPH STREET", width: "11m", dir: "TL", distance: 0.10, totalDist: 84.48, lat: 54.4200, lng: -6.4480 },
      { seq: 913, mode: "TRAVEL", street: "RETURN TO DEPOT", width: "N/A", dir: "TL", distance: 0.04, totalDist: 88.25, lat: 54.4250, lng: -6.4800 }
    ];

    let currentIndex = 0;
    let map, lorryMarker, routeLine;
    let voiceEnabled = true;

    // Initialize Leaflet Map
    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([54.4250, -6.4800], 15);
      
      // High-contrast tiles for night cab driving
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      // Plot route line on map
      const lineCoords = routeCARN1.map(p => [p.lat, p.lng]);
      routeLine = L.polyline(lineCoords, { color: '#ffcc00', weight: 6, opacity: 0.8 }).addTo(map);

      // Lorry Location Marker
      lorryMarker = L.marker([54.4250, -6.4800]).addTo(map);

      setTimeout(() => { map.invalidateSize(); }, 300);
    }

    // Update screen display and trigger voice
    function updateCabDisplay(speak = true) {
      const step = routeCARN1[currentIndex];
      
      const banner = document.getElementById("mode-banner");
      if (step.mode === "SALT") {
        banner.innerText = `⚠️ SPREAD SALT (${step.width})`;
        banner.className = "mode-banner mode-salt";
      } else {
        banner.innerText = "🟢 TRAVEL - NO SPREAD";
        banner.className = "mode-banner mode-travel";
      }

      document.getElementById("street-name").innerText = step.street;
      document.getElementById("dir-text").innerText = step.dir;
      document.getElementById("width-text").innerText = step.width;
      document.getElementById("dist-text").innerText = `${step.distance} km`;

      // Center map on lorry position
      const pos = [step.lat, step.lng];
      lorryMarker.setLatLng(pos);
      map.panTo(pos);

      // Hands-Free Voice Announcement
      if (voiceEnabled && speak) {
        speakInstruction(step);
      }
    }

    // Speech Synthesizer for Cab Voice Prompts
    function speakInstruction(step) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Clear previous queue
        let text = "";
        if (step.mode === "SALT") {
          text = `Start spreading ${step.width} wide on ${step.street}.`;
        } else {
          text = `Travel on ${step.street}. Stop spreading.`;
        }
        const msg = new SpeechSynthesisUtterance(text);
        msg.rate = 0.95;
        window.speechSynthesis.speak(msg);
      }
    }

    // Calculate distance between two lat/lng coordinates in meters
    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // Start Live Hands-Free Driving Tracking
    function startNavigation() {
      const status = document.getElementById("gps-status");
      const btn = document.getElementById("start-btn");
      btn.style.display = "none"; // Hide button after starting

      if (navigator.geolocation) {
        status.innerText = "GPS ACTIVE";
        status.className = "status-badge status-online";

        navigator.geolocation.watchPosition(pos => {
          const uLat = pos.coords.latitude;
          const uLng = pos.coords.longitude;

          // Update marker position
          lorryMarker.setLatLng([uLat, uLng]);
          map.panTo([uLat, uLng]);

          // Check if lorry reached next waypoint (within 50 meters)
          const targetStep = routeCARN1[currentIndex];
          const dist = getDistanceMeters(uLat, uLng, targetStep.lat, targetStep.lng);

          if (dist < 50 && currentIndex < routeCARN1.length - 1) {
            currentIndex++;
            updateCabDisplay(true);
          }
        }, err => {
          alert("GPS Location Access Required: " + err.message);
        }, {
          enableHighAccuracy: true,
          maximumAge: 1000
        });
      } else {
        alert("Geolocation is not supported by your mobile browser.");
      }
    }

    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      const btn = document.getElementById("voice-btn");
      btn.innerText = voiceEnabled ? "🔊 Voice: ON" : "🔇 Voice: OFF";
    }

    window.onload = function() {
      initMap();
      updateCabDisplay(false);
    };
  </script>
</body>
</html>
