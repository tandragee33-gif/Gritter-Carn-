  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #1e1e1e;
      padding: 8px 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #333;
      margin-bottom: 8px;
    }
    h1 { margin: 0; font-size: 16px; color: #ffcc00; }
    
    .status-badge {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 20px;
      text-transform: uppercase;
    }
    .status-online { background: #00aa00; color: #fff; }
    .status-offline { background: #aa0000; color: #fff; }

    /* Hands-Free High Visibility Map */
    #map {
      width: 100%;
      height: 45vh;
      border-radius: 10px;
      border: 2px solid #ffcc00;
      background: #222;
      margin-bottom: 8px;
    }

    /* Cab Main Alert Display Card */
    .card {
      background-color: #1e1e1e;
      border: 3px solid #ffcc00;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .mode-banner {
      padding: 10px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .mode-salt { background-color: #d32f2f; color: #ffffff; animation: flash 1.5s infinite; }
    .mode-travel { background-color: #2e7d32; color: #ffffff; }

    @keyframes flash {
      0% { opacity: 1; }
      50% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    .street-title {
      font-size: 20px;
      font-weight: bold;
      color: #ffffff;
      margin: 6px 0;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      background: #2a2a2a;
      padding: 8px;
      border-radius: 6px;
    }
    .info-box {
      font-size: 13px;
      color: #ccc;
    }
    .info-box div {
      font-size: 16px;
      font-weight: bold;
      color: #ffcc00;
      margin-top: 2px;
    }

    /* Control Bar */
    .controls {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .btn {
      flex: 1;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .btn-start { background: #0088ff; color: #fff; }
    .btn-voice { background: #555; color: #fff; }
  </style>

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([54.4250, -6.4800], 15);
      
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {

      routeLine = L.polyline(lineCoords, { color: '#ffcc00', weight: 6, opacity: 0.8 }).addTo(map);

    function updateCabDisplay(speak = true) {
      const step = routeCARN1[currentIndex];
      
      const banner = document.getElementById("mode-banner");
      if (step.mode === "SALT") {

        banner.className = "mode-banner mode-salt";
      } else {
        banner.innerText = "🟢 TRAVEL - NO SPREAD";
        banner.className = "mode-banner mode-travel";
      }

      document.getElementById("street-name").innerText = step.street;

      document.getElementById("width-text").innerText = step.width;
      document.getElementById("dist-text").innerText = `${step.totalDist} km`;

      const pos = [step.lat, step.lng];
      lorryMarker.setLatLng(pos);
      map.panTo(pos);

      if (voiceEnabled && speak) {
        speakInstruction(step);
      }
    }

    function speakInstruction(step) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        let text = step.mode === "SALT" 
          ? `Start spreading ${step.width} meters wide on ${step.street}.` 
          : `Travel on ${step.street}. Stop spreading.`;
        const msg = new SpeechSynthesisUtterance(text);
        msg.rate = 0.95;
        window.speechSynthesis.speak(msg);
      }
    }

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function startNavigation() {
      const status = document.getElementById("gps-status");
      const btn = document.getElementById("start-btn");
      btn.style.display = "none";

      if (navigator.geolocation) {
        status.innerText = "GPS ACTIVE";
        status.className = "status-badge status-online";

        navigator.geolocation.watchPosition(pos => {
          const uLat = pos.coords.latitude;
          const uLng = pos.coords.longitude;

          lorryMarker.setLatLng([uLat, uLng]);
          map.panTo([uLat, uLng]);

          const targetStep = routeCARN1[currentIndex];
          const dist = getDistanceMeters(uLat, uLng, targetStep.lat, targetStep.lng);

          if (dist < 50 && currentIndex < routeCARN1.length - 1) {
            currentIndex++;
            updateCabDisplay(true);
          }
        }, err => {
          alert("GPS Location Error: " + err.message);
        }, {
          enableHighAccuracy: true,
          maximumAge: 1000
        });
      } else {
        alert("Geolocation is not supported by your mobile browser.");
      }
    }

    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      const btn = document.getElementById("voice-btn");
      btn.innerText = voiceEnabled ? "🔊 Voice: ON" : "🔇 Voice: OFF";
    }

    window.onload = function() {
      initMap();
      updateCabDisplay(false);
    };
  </script>
</body>
</html>
